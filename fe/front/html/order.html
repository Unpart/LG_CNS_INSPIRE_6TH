<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Order</title>
        <link rel="stylesheet" href="../css/order.css"> 

    </head>
    <body>
        <img src="../img/bg.jpg" style="width: 100%; height: 300px;">
        <h1 id="heading">확인하세요</h1>
        <hr>
        <h2>주문 및 배송</h2>
        <div class="box">
            <span class="accent">오후 2시 이전</span> 주문건은 당일 배송됩니다.<br>
            오후 2시 이후 주문건은 익일 배송됩니다.(주말, 공휴일 제외)
        </div>

        <hr>
        <h2>교환 및 환불</h2>
        <div class="box">
            불만족시<span class="accent">100%</span> 환불해드립니다.<br>
            고객센터로 문의주시면 신속하게 처리해드립니다.
        </div>

        <hr>
        <h2 text="customer">고객센터</h2>
        <div class="box">
            02-1234-5678<br>
            <span class="text-small">
                상담시간 : 오전 9시 ~ 오후 6시 (주말, 공휴일 제외)
            </span>
        </div>
    </body>
</html>
