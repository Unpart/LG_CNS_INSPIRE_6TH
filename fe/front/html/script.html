<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>script</title>
    </head>
    <body>
        <script>
            /*
            변수 - 데이터를 담는 그릇
            script(interpriter)
            - 변수의 타입이 존재하지 않는다(es6 var, let, const).
            - 변수의 타입이 존재하는 스크립트를 쓰고 싶으면 typescript
            - 실행시점(변수에 값이 할당되는 시점)에 변수의 타입이 묵시적으로 할당
            - 기본타입(숫자, 문자(열), 논리, null, undefined)
            - 참조타입(Object, Array, Function, etc.....) ----> Object
            - 흐름제어구문, 반복구문
            - 함수(Function)
            */

            // console.log(`debug >>>> message = ${message}`); ``사이의 ${} 이거 templete string 기본 문법
           var message = "script";
           console.log(`debug >>>> message = ${message}`);
           console.log(`debug >>>> message type ${typeof message}`);

           message = 10;
           console.log(`debug >>>> message = ${message}`);
           console.log(`debug >>>> message type ${typeof message}`);
           console.log(`debug >>>> message == ${message == "10"}`);
           console.log(`debug >>>> message === ${message === "10"}`);

           var message = "script";
           var message = "script";

           let msg = "let 키워드를 이용하면 중복 변수 선언을 방지할 수 있습니다.";
           // let msg = "let 키워드를 이용하면 중복 변수 선언을 방지할 수 있습니다.";
           // var은 중복 변수 선언이 가능해서 왠만해서는 쓰지 않는다. es6 기준으로는 왠만하면 let으로 쓴다.
           const num = 10;
           // const는 상수로 값 재할당이 불가능하다.

           console.log(`debug >>>> 스크립트에서 가장 많이 사용하는 변수의 타입 = Object`);
           console.log(`debug >>>> script object === json(rest api {key:value} )`);
           let obj = {
                name : "jslim",
                age : 20,
                major : "cs"
           };
           console.log("debug >>>> obj value ", obj);
           console.log("debug >>>> obj type ", typeof obj);
           console.log("debug >>>> obj property ", obj.major);
           console.log("debug >>>> obj property ", obj['major']);

           console.log("debug >>>> 스크립트 객체를 담는 변수의 타입 [] - Array")
           let ary = [
                { name : "inspire"}, { name : "lgcns"}, { name : "am"}, { name : "camp6th"}
           ];
           console.log("debug >>>> ary value ", ary);
           console.log("debug >>>> ary type ", typeof ary);
           console.log("debug >>>> ary index ", ary[0].name);
           console.log(`debug >>>> ary index ${ary[3].name}`);
           console.log("debug >>>> array function : map(), filter(), forEach() ");
        </script>
    </body>
</html>
