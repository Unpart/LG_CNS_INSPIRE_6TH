<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
    </head>
    <body>
        <script>
            /*
                함수(function) vs 메서드(method)
                arrow function vs lambda expression
                - 코드블럭(특정 기능을 수행하기 위한)
            */
            // definition
            function test(x, y) {
                    return x + y;
            };
            // calling
            let result = test(10, 20);
            console.log(`debug >>>> result ${result}`);

            let btnHandler = function() {
                    console.log(`익명의 함수입니다.`);
            };
            console.log(`debug >>>> function type ${typeof btnHandler}`);
            btnHandler();

            // es6 : arrow function
            let arrowFunc = () => {
                    console.log(`화살표 함수 호출!!`);
            };
            arrowFunc();
            let add = (a, b) => a + b;
            let add2 = (a, b) => {
                    a + b
            };
            console.log(`debug >>>> add function ${add(10, 30)}`);
            console.log(`debug >>>> add function ${add2(10, 30)}`);

            let obj = {
                    name : "jslim",
                    study : function() {
                        return["html", "script", "css"];
                    }
            };
            let ary = obj.study();
            console.log(`debug >>>> ary `, ary);

            // es6
            // 구조분해 = Destructuring
            let html = "html";
            let script = "script";
            let css = "css";
            obj = {
                    name : "jslim",
                    study : function() {
                        return {
                            html : "html",
                            script : "script",
                            css : "css"
                        }
                    }
            };
                //    let {html, script, css} = obj.study();
                //    console.log(`debug >>>> html `, html);
            console.log(`debug >>>> 배열 변수와 함께 사용되는 함수의 람다식 `);
            const ages = [16, 17, 18, 19, 20, 21];

            const newAges = ages.map(age => age *2);
            console.log(`debug >>>> newAges `, newAges);

            const evenAges = ages.filter(age => age % 2 === 0);
            console.log(`debug >>>> evenAges `, evenAges);
            /*
            Q1
            - email 값을 키로하고 nickname 값을 값으로 하는 새로운 객체로 만들려고 한다.
            - 즉, 배열을 가공해서 하나의 객체로 합치는 것
            hint!
            - array : reduce() 함수
            */
            const userAry = [
                { email : "naver.com" , nickName : "IronMan"},
                { email : "google.com", nickName : "Bob"},
                { email : "daum.com"  , nickName : "Alice"}
            ];

            const reduceArray = userAry.reduce((acc, user) => {
                acc[user.email] = user.nickName;
                return acc;
            }, {});
            console.log(reduceArray);

        </script>
    </body>
</html>
