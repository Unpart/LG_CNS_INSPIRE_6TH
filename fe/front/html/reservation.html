<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Reservation</title>
        <link rel="stylesheet" href="../css/reservation.css">
    </head>
    <body>
        <form action="./thanks.html" method="get">
            <fieldset>
                <legend>배송예약 정보입력</legend>
                <ul>
                    <li>
                        <label>주문상품</label>
                        <input
                            type="text" 
                            id="prd-name"
                            name="prd-name"
                            placeholder="상품이름을 입력하세요" />
                    </li>
                    <li>
                        <label>주문자명</label>
                        <input
                            type="text"
                            id="prd-user-name"
                            name="prd-user-name"
                            placeholder="주문자명을 입력하세요" />
                    </li>
                    <li>
                        <label>배송지</label>
                        <input
                            type="text"
                            id="prd-user-address"
                            name="prd-user-address"
                            placeholder="배송지를 입력하세요" />
                    </li>
                    <li>
                        <label>이메일</label>
                        <input
                            type="email"
                            id="prd-user-email"
                            name="prd-user-email"
                            placeholder="이메일을 입력하세요" />
                    </li>
                    <li>
                        <label>배송일 지정</label>
                        <input
                            type="date"
                            id="prd-user-date"
                            name="prd-user-date"
                            placeholder="배송일을 입력하세요" />
                    </li>
                    <div align="center">
                        <button type="submit">예약하기</button>
                        <button type="reset">취소하기</button>
                    </div>
                </ul>
            </fieldset>
        </form>
    </body>
</html>
